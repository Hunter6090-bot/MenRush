# Dependabot config.
#
# Version updates are switched off (open-pull-requests-limit: 0), so this
# file only shapes Dependabot security updates, which stay on.
#
# Tailwind CSS majors are ignored: Tailwind 4 drops the v3 PostCSS plugin and
# breaks the frontend build, so it needs its own planned migration. Minor and
# patch updates for Tailwind 3 still come through.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/frontend"
      - "/backend"
      - "/social-studio"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tailwindcss/*"
        update-types: ["version-update:semver-major"]

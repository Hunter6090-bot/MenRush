name: apply-mr3free-extend-patch
on:
  push:
    branches: [fix/mr3free-extend-31-oct-v2]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch, drop helper files, push
        run: |
          set -euo pipefail
          if [ ! -f patches/mr3free-extend-31-oct.patch ]; then
            echo "No patch file; nothing to do."
            exit 0
          fi
          git apply patches/mr3free-extend-31-oct.patch
          rm -f patches/mr3free-extend-31-oct.patch
          rmdir patches 2>/dev/null || true
          rm -f .github/workflows/apply-mr3free-extend-patch.yml
          git config user.name "alzain"
          git config user.email "al.zain9690@gmail.com"
          git add -A
          git status
          git commit -m "fix(promo): extend MR3FREE claim window to 31 Oct 2026"
          git push

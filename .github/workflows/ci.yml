name: CI

on:
  pull_request:
    branches:
      - main
      # Land rate-limit / age-gate fixes into open #97 without retargeting to main.
      - cursor/adult-assurance-enforcement-fac3
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # TEMPORARY: remove with the proxy-hop diagnostic.
      - name: Proxy-hop diagnostic (no IP in logs, dedupe, cap)
        run: npm run test:proxy-hop-diagnostic

  backend-adult-assurance:
    name: Adult assurance + Veriff checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Adult assurance checks
        run: npm run test:adult-assurance
      - name: Adult assurance status-poll rate limit
        run: npm run test:adult-assurance-rate-limit
      - name: Veriff checks
        run: npm run test:veriff

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # Integration tests that need a real Postgres + PostGIS (map feed blocks and
  # Ghost, radius on the fuzzed pin, etc.). Throwaway DB per run.
  backend-db-integration:
    name: DB integration (PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: menrush
          POSTGRES_PASSWORD: menrush
          POSTGRES_DB: menrush_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U menrush -d menrush_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://menrush:menrush@localhost:5432/menrush_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Load schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f ../database/schema.sql
      - name: Run migrations
        run: npm run db:migrate
      - name: Map feed leaves out blocked and Ghost members
        run: npm run test:map-feed-blocks
      # --if-present: these scripts arrive with their own PRs (#333, #327,
      # #328, Community Ghost). The step is a no-op until the script exists.
      - name: Radius on the fuzzed pin (oracle)
        run: npm run --if-present test:radius-oracle
      - name: Show distance
        run: npm run --if-present test:show-distance-integration
      - name: Hide my location from
        run: npm run --if-present test:hide-location-integration
      - name: Community leaves out Ghost and hidden members
        run: npm run --if-present test:community-ghost-hidden
